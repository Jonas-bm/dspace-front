<div class="thumbnail" [class.limit-width]="limitWidth">
  @if (isLoading()) {
    <div class="thumbnail-content outer">
      <div class="inner">
        <div class="centered">
          <ds-loading [spinner]="true"></ds-loading>
        </div>
      </div>
    </div>
  }
  <!-- If we have a PDF URL and no generated thumbnail, render the PDF thumbnail -->
  @if (pdfUrl && src() === null && isLoading() === false) {
    <ds-pdf-thumbnail [pdfUrl]="pdfUrl" [fallbackUrl]="defaultImage" [alt]="alt | translate" class="thumbnail-content img-fluid"></ds-pdf-thumbnail>
  }
  <!-- don't use *ngIf="!isLoading" so the thumbnail can load in while the animation is playing -->
  @if (src() !== null) {
    <img class="thumbnail-content img-fluid"
         [class.d-none]="isLoading()"
         [src]="src() | dsSafeUrl"
         [alt]="alt | translate"
         (error)="errorHandler()"
         (load)="successHandler()"/>
  }
  @if (src() === null && !pdfUrl && isLoading() === false) {
    <div class="thumbnail-content outer">
      <div class="inner">
        <div class="thumbnail-placeholder centered">
          {{ placeholder | translate }}
        </div>
      </div>
    </div>
  }
</div>
