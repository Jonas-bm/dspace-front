<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
  </defs>
  <!-- Globe Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbit Ring -->
    <ellipse cx="25" cy="25" rx="23" ry="10" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-25 25 25)"/>
    <!-- Sphere -->
    <circle cx="25" cy="25" r="18" fill="url(#globeGrad)"/>
    <!-- Globe Grid Lines -->
    <ellipse cx="25" cy="25" rx="10" ry="18" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <line x1="7" y1="25" x2="43" y2="25" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    <path d="M 12 16 Q 25 21 38 16" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <path d="M 12 34 Q 25 29 38 34" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <circle cx="34" cy="18" r="2.5" fill="#00ffcc"/>
  </g>
  <!-- Text UNID -->
  <text x="75" y="47" font-family="'Montserrat', 'Nunito', 'Segoe UI', sans-serif" font-weight="900" font-size="36" fill="#0099ff" letter-spacing="1.5">
    UNID
  </text>
</svg>
